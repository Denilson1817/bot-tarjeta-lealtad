[project]
name = "tarjeta-lealtad"
version = "0.1.0"
description = "Bot de Telegram que registra citas y genera la tarjeta de lealtad de cada cliente"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.32,<4",
    "pillow>=13,<14",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9",
    "pytest-asyncio>=1.5",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Solo código: ruff también formatea bloques de código en Markdown y los gates no deben depender de la documentación.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Tipografía del español en textos y comentarios (medidas "1050 × 600", rangos "50–440").
allowed-confusables = ["×", "–"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
